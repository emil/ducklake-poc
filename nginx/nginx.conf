server {
    listen 80;
    server_name localhost;

    # Clean HTTP paths (no hive `key=` prefixes) for lake/compacted
    # files -- translates .../lake/<experiment>/<shot>/<stage>/<file>
    # into the real on-disk hive-partition path
    # (.../lake/experiment=X/shot=Y/stage=Z/<file>) before the /data/
    # location below resolves it. The on-disk hive directory naming is
    # what ducklake_add_data_files needs to register partitioned tables
    # correctly (see the README's "Physical layout & partitioning"
    # section) -- it's an implementation detail, not something HTTP
    # clients should need to know about, hence the rewrite. This also
    # applies to requests generated by the /range-proxy/ loopback below,
    # since a proxy_pass sub-request is matched against these location
    # blocks fresh, just like any other incoming request.
    #
    # Two details that matter here, both found by actually testing
    # against real files rather than just reading the regex:
    #   - experiment/shot/stage must NOT match "=" (`[^/=]+`, not
    #     `[^/]+`): otherwise this regex also matches its OWN rewritten
    #     output (since "experiment=X" still satisfies a bare `[^/]+`),
    #     causing an infinite rewrite loop.
    #   - An optional, preserved prefix (`(?<prefix>(?:.+/)?)`) is needed
    #     because local_demo.py nests its output one directory deeper
    #     (.../lake/local_demo/<experiment>/...) than the real pipeline
    #     does, to avoid colliding with real data. Without preserving
    #     that prefix through the rewrite, paths with any extra leading
    #     directory segment 404 -- the file exists, just not at the path
    #     nginx ends up looking for.
    location ~ ^/data/lake/(?<prefix>(?:.+/)?)(?<experiment>[^/=]+)/(?<shot>[^/=]+)/(?<stage>[^/=]+)/(?<filename>[^/]+)$ {
        rewrite ^ /data/lake/${prefix}experiment=$experiment/shot=$shot/stage=$stage/$filename last;
    }

    # Serve the lake's parquet files directly. nginx supports byte-range
    # requests (Range: bytes=...) for static files out of the box, which is
    # exactly what a parquet-aware client (or curl) needs to fetch just the
    # footer or a single row group instead of the whole file.
    location /data/ {
        alias /usr/share/nginx/html/data/;
        autoindex on;
        autoindex_exact_size off;

        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600";

        # allow the demo scripts (and a browser) to call this from anywhere
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges";
    }

    location / {
        default_type text/plain;
        return 200 "DuckLake POC file server.\nBrowse parquet files at /data/\nUse Range requests to fetch partial files, e.g.:\n  curl -r 0-1023 http://localhost:8080/data/<path>.parquet -o chunk.bin\n";
    }

    # Server-computed byte-range serving for the wave-lookup API
    # (ducklake_poc.api_server). This is an nginx "loopback": it proxies
    # back to nginx's own /data/ location above, but constructs the
    # *request's* Range header from a query arg ($arg_r) rather than
    # reading whatever Range header the actual client sent -- the client
    # doesn't know byte offsets (that's the whole point of the lookup),
    # so the API server computes them and redirects here with the range
    # baked into the URL. proxy_set_header works for a self-referential
    # proxy_pass exactly like it would for any other upstream; the target
    # /data/ location then does its normal Range-aware static serving,
    # oblivious to whether the Range header came from a real client or
    # from this injected one.
    #
    # Verified empirically: byte-for-byte identical to a real client
    # `curl -r start-end` request against the same file.
    #
    # Deliberately NOT marked `internal` -- the API server issues a real
    # client-facing HTTP redirect (302) here, so it must stay externally
    # reachable. This does mean a client could construct arbitrary
    # ?r=bytes=... values directly, bypassing the manifest lookup -- fine
    # for this POC (the data isn't sensitive and the byte ranges are
    # already effectively public via the manifest), but worth locking
    # down (e.g. a signed query string) before using this pattern for
    # anything access-controlled.
    location /range-proxy/ {
        proxy_pass http://127.0.0.1/data/;
        proxy_set_header Range $arg_r;
        proxy_hide_header Content-Type;
        add_header Content-Type application/vnd.apache.parquet always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
    }
}
