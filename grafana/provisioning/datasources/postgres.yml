apiVersion: 1

datasources:
  # Grafana's built-in PostgreSQL data source. It needs no plugin.
  # The credentials come from the environment of the grafana container
  # (see docker-compose.yml).
  - name: Catalog
    uid: ducklake-catalog
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ${PG_USER}
    isDefault: true
    jsonData:
      database: ${PG_DB}
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
    secureJsonData:
      password: ${PG_PASSWORD}
